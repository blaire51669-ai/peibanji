<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会员中心 · 陪伴记</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">♡ 陪伴记</a><nav><a href="index.html">返回首页</a></nav></header><main class="section" style="max-width:680px;margin:auto"><h1>会员中心</h1><p>邮箱注册并登录后，可查看账号状态。此阶段提供账号基础接口；资料编辑、照片管理及会员审核需继续接入。</p><section class="card card-body"><h2>注册</h2><label>邮箱 <input id="re" type="email" autocomplete="email"></label><label>密码（至少12位） <input id="rp" type="password" autocomplete="new-password"></label><button class="button primary" id="register">创建账号</button></section><section class="card card-body" style="margin-top:16px"><h2>登录</h2><label>邮箱 <input id="le" type="email"></label><label>密码 <input id="lp" type="password"></label><button class="button primary" id="login">登录</button> <button class="button ghost" id="logout">退出登录</button><pre id="msg" role="status"></pre></section></main><script src="member.js"></script></body></html>
