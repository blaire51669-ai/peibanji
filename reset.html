<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>重置密码 · 陪伴记</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site-header"><a class="brand" href="index.html">♡ 陪伴记</a><nav><a href="member.html">会员中心</a></nav></header>
<main class="section" style="max-width:560px;margin:auto">
  <h1>重置密码</h1>
  <form id="reset-form">
    <label>新密码（至少12位） <input id="np" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
    <label>确认新密码 <input id="np2" type="password" autocomplete="new-password" required></label>
    <button class="button primary" type="submit">设置新密码</button>
    <p class="form-status" id="msg" role="status"></p>
  </form>
  <p id="done" hidden><a class="button primary" href="member.html">前往登录</a></p>
</main>
<script>
const token = new URLSearchParams(location.hash.slice(1)).get('token');
history.replaceState(null, '', location.pathname);
const msg = document.querySelector('#msg');
if (!token) { msg.textContent = '重置链接不完整，请回到邮件里重新点击链接。'; document.querySelector('#reset-form button').disabled = true; }
document.querySelector('#reset-form').onsubmit = async e => {
  e.preventDefault();
  const p = document.querySelector('#np').value;
  if (p.length < 12) { msg.textContent = '密码至少 12 位。'; return; }
  if (p !== document.querySelector('#np2').value) { msg.textContent = '两次输入的密码不一致。'; return; }
  msg.textContent = '正在保存…';
  try {
    const r = await fetch('/api/members/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: p }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { msg.textContent = '密码已重置，请用新密码登录。'; document.querySelector('#reset-form').hidden = true; document.querySelector('#done').hidden = false; }
    else msg.textContent = j.error || '重置失败，请稍后再试。';
  } catch { msg.textContent = '网络错误，请稍后重试。'; }
};
</script>
</body></html>
